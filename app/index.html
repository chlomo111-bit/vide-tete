<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vide-Tête</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout : une colonne façon appli de poche — micro en haut, filtres par domaine, puis une seule liste où tout est visible */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --sunk:#E4E8EE; --ink:#151A22; --muted:#5A6372; --line:#D8DEE6;
  --accent:#F2542D; --accent-ink:#FFFFFF; --late:#C42B2B; --ok:#1C8752;
  --d-photo:#6E46F0; --d-resto:#C97800; --d-jeux:#D23C80; --d-video:#1C82C4; --d-applis:#12907F; --d-perso:#68707D;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1217; --surface:#181C23; --sunk:#12161C; --ink:#EDF0F4; --muted:#98A1AE; --line:#29303A;
  --accent:#FF6A45; --accent-ink:#1A0D08; --late:#FF6B6B; --ok:#4CC98A;
  --d-photo:#A58BFF; --d-resto:#F0A53A; --d-jeux:#F27AB0; --d-video:#5DB6F0; --d-applis:#43C7B4; --d-perso:#A2AAB6;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1217; --surface:#181C23; --sunk:#12161C; --ink:#EDF0F4; --muted:#98A1AE; --line:#29303A;
  --accent:#FF6A45; --accent-ink:#1A0D08; --late:#FF6B6B; --ok:#4CC98A;
  --d-photo:#A58BFF; --d-resto:#F0A53A; --d-jeux:#F27AB0; --d-video:#5DB6F0; --d-applis:#43C7B4; --d-perso:#A2AAB6;
  color-scheme:dark }
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
.app{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.brand{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1}
.date{color:var(--muted);font-size:14px;margin-top:6px}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:7px 12px;color:var(--muted);font-size:13px;display:inline-flex;gap:6px;align-items:center}
.ghost:hover{color:var(--ink);border-color:var(--muted)}

.capture{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px}
.cap-top{display:flex;gap:14px;align-items:center}
.mic{flex:none;width:72px;height:72px;border-radius:50%;border:none;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;position:relative;transition:transform .15s}
.mic:active{transform:scale(.95)}
.mic svg{width:30px;height:30px}
.mic.on::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:3px solid var(--accent);animation:pulse 1.4s ease-out infinite}
@keyframes pulse{from{opacity:.9;transform:scale(.92)}to{opacity:0;transform:scale(1.25)}}
@media (prefers-reduced-motion:reduce){.mic.on::after{animation:none;opacity:.6}}
.cap-txt h2{font-size:20px;letter-spacing:-.01em}
.cap-txt p{margin:3px 0 0;color:var(--muted);font-size:13.5px}
.partial{color:var(--muted);font-style:italic}
textarea#saisie{width:100%;min-height:60px;resize:vertical;border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:10px 12px}
.cap-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hint{font-size:12.5px;color:var(--muted)}
.btn{border:none;border-radius:999px;padding:9px 18px;background:var(--ink);color:var(--bg);font-weight:600}
.btn:disabled{opacity:.45;cursor:default}
.btn.sec{background:var(--sunk);color:var(--ink)}
.recu{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.recu .msg{font-weight:500}
.recu ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.recu li{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.thinking{color:var(--muted)}

nav.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px}
nav.tabs button{flex:1;border:none;background:none;border-radius:999px;padding:8px 10px;font-weight:600;color:var(--muted);white-space:nowrap;font-size:14px}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.count{font-variant-numeric:tabular-nums;font-weight:500;opacity:.7;margin-left:4px}

.outils{display:flex;flex-direction:column;gap:10px}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px}
.doms{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.doms::-webkit-scrollbar{display:none}
.doms button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px;color:var(--dc,var(--ink));display:inline-flex;gap:4px;align-items:center}
.doms button[aria-pressed="true"]{background:var(--dc,var(--ink));color:var(--surface);border-color:var(--dc,var(--ink))}

section.view{display:flex;flex-direction:column;gap:20px}
.bloc h3{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-family:var(--f-body);font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.bloc.late h3{color:var(--late)}
.bloc.dom h3{color:var(--dc);font-family:var(--f-display);font-size:19px;text-transform:none;letter-spacing:-.01em;font-weight:800}
.separe{font-family:var(--f-display);font-size:22px;font-weight:800;letter-spacing:-.01em;margin-top:6px}
ul.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
ul.list li{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-top:1px solid var(--line)}
ul.list li:first-child{border-top:none}
.chk{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);background:none;margin-top:0;display:grid;place-items:center;color:#fff;padding:0}
.chk:hover{border-color:var(--muted)}
.chk.done{background:var(--ok);border-color:var(--ok)}
.chk svg{width:14px;height:14px}
.dot{flex:none;width:24px;display:grid;place-items:center;color:var(--muted);font-size:16px;margin-top:0}
.it{flex:1;min-width:0}
.it .t{font-weight:500;overflow-wrap:anywhere}
.it .n{font-size:13px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
li.fait .t{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;font-size:12.5px;color:var(--muted);align-items:center}
.meta:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--dc) 14%,transparent);color:var(--dc)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--dc)}
.tag{font-size:11.5px;padding:1px 7px;border-radius:6px;border:1px solid var(--line)}
.tag.late{color:var(--late);border-color:color-mix(in srgb,var(--late) 40%,transparent)}
.tag.auto{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.icon{flex:none;background:none;border:none;color:var(--muted);padding:4px;border-radius:8px}
.icon:hover{color:var(--ink);background:var(--sunk)}
.icon svg{width:18px;height:18px;display:block}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:16px;color:var(--muted);font-size:14px}
.d-photo{--dc:var(--d-photo)} .d-resto{--dc:var(--d-resto)} .d-jeux{--dc:var(--d-jeux)} .d-video{--dc:var(--d-video)} .d-applis{--dc:var(--d-applis)} .d-perso{--dc:var(--d-perso)}

form.add{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
form.add .row{display:flex;gap:8px;flex-wrap:wrap}
form.add input,form.add select{flex:1 1 140px;min-width:0;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:8px 10px}
form.add input.n{flex:0 0 70px}
form.add .lbl{font-size:13px;color:var(--muted)}

.sheet{position:fixed;inset:0;background:rgba(10,12,16,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet .card{background:var(--surface);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:10px;max-height:90vh;overflow:auto}
.sheet label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.sheet input,.sheet select,.sheet textarea{border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:9px 10px;color:var(--ink)}
.sheet textarea{min-height:64px;resize:vertical}
.sheet .row{display:flex;gap:10px;flex-wrap:wrap}
.sheet .row>label{flex:1 1 130px}
.sheet .acts{display:flex;justify-content:space-between;gap:10px;margin-top:6px;flex-wrap:wrap}
.danger{background:none;border:none;color:var(--late);font-weight:600}
.notice{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:10px;padding:10px 12px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <div class="brand">Vide-Tête</div>
      <div class="date" id="dateDuJour"></div>
    </div>
    <button class="ghost" id="ecouter" hidden>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      <span>Écouter mon programme</span>
    </button>
  </header>

  <div class="capture">
    <div class="cap-top">
      <button class="mic" id="mic" aria-label="Parler" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <div class="cap-txt">
        <h2 id="capTitre">Qu'est-ce qui te passe par la tête ?</h2>
        <p>Une idée, une tâche, un rendez-vous. Je range tout dans le bon domaine.</p>
      </div>
    </div>
    <div class="partial" id="partial" hidden></div>
    <textarea id="saisie" placeholder="Ex : samedi séance photo grossesse à Herzliya à 16h, et je dois rappeler Tal"></textarea>
    <div class="cap-actions">
      <span class="hint" id="hint">Sur iPhone, touche le micro du clavier pour dicter.</span>
      <button class="btn" id="envoyer">Ranger</button>
    </div>
    <div class="recu" id="recu" hidden></div>
  </div>

  <nav class="tabs" role="tablist">
    <button role="tab" data-v="liste" aria-selected="true">Ma liste<span class="count" id="cListe"></span></button>
    <button role="tab" data-v="idees" aria-selected="false">Idées<span class="count" id="cIdees"></span></button>
    <button role="tab" data-v="routines" aria-selected="false">Routines</button>
  </nav>

  <div class="outils" id="outils">
    <input class="search" id="recherche" type="search" placeholder="Chercher (Hot, galerie, Tal…)" aria-label="Chercher">
    <div class="doms" id="filtres"></div>
  </div>

  <div class="notice" id="etatDonnees">Chargement de tes listes…</div>

  <section class="view" id="v-liste"></section>
  <section class="view" id="v-idees" hidden></section>
  <section class="view" id="v-routines" hidden></section>
</div>

<div class="sheet" id="sheet" hidden>
  <form class="card" id="editForm">
    <h3>Modifier</h3>
    <label>Titre<input id="eTitre" required></label>
    <label>Pourquoi / détails<textarea id="eNote" placeholder="La raison, le numéro à appeler, le contexte…"></textarea></label>
    <div class="row">
      <label>Type<select id="eType"><option value="tache">Tâche</option><option value="rdv">Rendez-vous</option><option value="idee">Idée</option></select></label>
      <label>Domaine<select id="eDom"></select></label>
    </div>
    <div class="row">
      <label>Date<input type="date" id="eDate"></label>
      <label>Heure<input type="time" id="eHeure"></label>
    </div>
    <div class="acts">
      <button type="button" class="danger" id="eSuppr">Supprimer</button>
      <span style="display:flex;gap:8px">
        <button type="button" class="btn sec" id="eAnnuler">Annuler</button>
        <button class="btn" type="submit">Enregistrer</button>
      </span>
    </div>
  </form>
</div>

<script>
const DOMAINES = {
  photo:{nom:"Photo", desc:"business photo : séances, clients, galeries, pubs, site photo, matériel"},
  resto:{nom:"Restaurant", desc:"café-restaurant Coffee Time : commandes fournisseurs (פעמית, תנובה, ארבע עונות…), factures, équipe, planning"},
  jeux:{nom:"Jeux Instagram", desc:"jeux communauté Instagram : vidéos, stories, commentaires, abonnés"},
  video:{nom:"Vidéo", desc:"chaînes et contenus vidéo, reels, montage"},
  applis:{nom:"Applis & sites", desc:"applis, sites web, bots WhatsApp, projets tech, BarberShops, clients web"},
  perso:{nom:"Perso / admin", desc:"perso, budget, banque, assurances, abonnements, administratif, tout le reste"}
};
const JOURS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];

const iso = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parseIso = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d=parseIso(s); d.setDate(d.getDate()+n); return iso(d); };
const diffDays = (a,b) => Math.round((parseIso(b)-parseIso(a))/864e5);
const today = () => iso(new Date());
function joliDate(s){
  const t=today(), n=diffDays(t,s);
  if(n===0) return "aujourd'hui"; if(n===1) return "demain"; if(n===-1) return "hier";
  const d=parseIso(s);
  if(n>1 && n<7) return JOURS[d.getDay()];
  return JOURS[d.getDay()]+" "+d.getDate()+" "+MOIS[d.getMonth()];
}
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = id => document.getElementById(id);

/* ---------- Données ---------- */
const S = { items:[], routines:[], regles:[], vue:"liste", filtre:"tout", q:"" };
let db=null;
const mem = { items:new Map(), routines:new Map(), regles:new Map() };
async function ajouter(col, data){
  if(db){ const r=await db.collection(col).add(data); return r.id; }
  const id=Math.random().toString(36).slice(2); mem[col].set(id,{...data}); syncMem(col); return id;
}
async function maj(col,id,patch){
  if(db) return db.collection(col).doc(id).update(patch);
  mem[col].set(id,{...mem[col].get(id),...patch}); syncMem(col);
}
async function suppr(col,id){
  if(db) return db.collection(col).doc(id).delete();
  mem[col].delete(id); syncMem(col);
}
function syncMem(col){ S[col]=[...mem[col]].map(([id,d])=>({id,...d})); render(); }

/* ---------- Routines ---------- */
function etatRoutine(r){
  const t=today();
  if(r.dernier===t) return "fait";
  if(r.mode==="tous"){
    const n=Number(r.tous)||7;
    if(!r.dernier) return "due";
    const ecart=diffDays(r.dernier,t);
    if(ecart>n) return "retard";
    return ecart>=n ? "due" : null;
  }
  const wd=parseIso(t).getDay(), jour=Number(r.jour);
  if(wd===jour) return "due";
  const recul=(wd-jour+7)%7, derniere=addDays(t,-recul);
  if(recul<=3 && (!r.dernier || r.dernier<derniere) && (!r.depuis || r.depuis<=derniere)) return "retard";
  return null;
}
function rythme(r){
  if(r.mode==="tous"){
    const n=Number(r.tous)||7;
    return "tous les "+n+" jours"+(r.dernier ? " · dernière fois "+joliDate(r.dernier) : " · jamais fait");
  }
  return "chaque "+JOURS[Number(r.jour)];
}

/* ---------- Filtres ---------- */
const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
function passe(x){
  if(S.filtre!=="tout" && x.domaine!==S.filtre) return false;
  if(S.q){ const q=norm(S.q); if(!norm(x.titre+" "+(x.note||"")+" "+((DOMAINES[x.domaine]||{}).nom||"")).includes(q)) return false; }
  return true;
}

/* ---------- Rendu ---------- */
const ICON_CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L19 7"/></svg>';
const ICON_EDIT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>';
const ICON_X='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';
const domKey = d => DOMAINES[d]?d:"perso";
const chip = d => `<span class="chip d-${domKey(d)}">${esc(DOMAINES[domKey(d)].nom)}</span>`;

function ligneItem(it, opts={}){
  const t=today(), late = !it.fait && it.date && it.date<t && it.type!=="idee";
  const tags=[];
  if(opts.dom!==false) tags.push(chip(it.domaine));
  if(it.type==="rdv") tags.push('<span class="tag">Rendez-vous</span>');
  if(it.date) tags.push(`<span class="tag${late?" late":""}">${late?"en retard · ":""}${esc(joliDate(it.date))}${it.heure?" · "+esc(it.heure):""}</span>`);
  else if(it.heure) tags.push(`<span class="tag">${esc(it.heure)}</span>`);
  if(it.auto) tags.push('<span class="tag auto">suite auto</span>');
  const box = it.type==="idee" ? `<span class="dot" aria-hidden="true">✦</span>` : `<button class="chk${it.fait?" done":""}" data-act="toggle" data-id="${it.id}" aria-label="${it.fait?"Marquer à faire":"Marquer fait"}">${it.fait?ICON_CHECK:""}</button>`;
  const note = it.note ? `<div class="n">${esc(it.note)}</div>` : "";
  return `<li class="${it.fait?"fait":""}">${box}<div class="it"><div class="t">${esc(it.titre)}</div>${note}<div class="meta">${tags.join("")}</div></div>
    <button class="icon" data-act="edit" data-id="${it.id}" aria-label="Modifier">${ICON_EDIT}</button></li>`;
}
function ligneRoutine(r, opts={}){
  const e=etatRoutine(r);
  const tags=[];
  if(opts.dom!==false) tags.push(chip(r.domaine));
  tags.push(`<span class="tag${e==="retard"?" late":""}">${e==="retard"?"en retard · ":""}${esc(rythme(r))}</span>`);
  return `<li class="${e==="fait"?"fait":""}"><button class="chk${e==="fait"?" done":""}" data-act="routine" data-id="${r.id}" aria-label="Marquer fait">${e==="fait"?ICON_CHECK:""}</button>
    <div class="it"><div class="t">${esc(r.titre)}</div><div class="meta">${tags.join("")}</div></div></li>`;
}
const bloc = (titre, lignes, cls="") => lignes.length ? `<div class="bloc ${cls}"><h3><span>${titre}</span><span class="count">${lignes.length}</span></h3><ul class="list">${lignes.join("")}</ul></div>` : "";
const ordre = (a,b) => (a.date||"9999").localeCompare(b.date||"9999") || (a.heure||"99").localeCompare(b.heure||"99") || (a.cree||0)-(b.cree||0);

function render(){
  const t=today(), fin=addDays(t,7);
  const actifs=S.items.filter(i=>i.type!=="idee");
  const ouverts=actifs.filter(i=>!i.fait);
  const idees=S.items.filter(i=>i.type==="idee");
  const rDue=S.routines.filter(r=>["due","retard"].includes(etatRoutine(r)));

  // Compteurs
  const nbOuverts=ouverts.length+rDue.length;
  $("cListe").textContent=nbOuverts||"";
  $("cIdees").textContent=idees.length||"";

  // Filtres par domaine (compte ce qui est à faire)
  const base = S.vue==="idees" ? idees : [...ouverts, ...rDue];
  const nbDom = k => base.filter(x=>x.domaine===k).length;
  $("filtres").innerHTML = `<button data-filtre="tout" aria-pressed="${S.filtre==="tout"}">Tout<span class="count">${base.length||""}</span></button>`
    + Object.entries(DOMAINES).map(([k,v])=>`<button class="d-${k}" data-filtre="${k}" aria-pressed="${S.filtre===k}">${esc(v.nom)}<span class="count">${nbDom(k)||""}</span></button>`).join("");
  $("outils").hidden = S.vue==="routines";

  // ----- Ma liste -----
  const o=ouverts.filter(passe), rr=S.routines.filter(passe);
  const rRetard=rr.filter(r=>etatRoutine(r)==="retard"), rAuj=rr.filter(r=>etatRoutine(r)==="due"), rFait=rr.filter(r=>etatRoutine(r)==="fait");
  const retard=o.filter(i=>i.date && i.date<t).sort(ordre);
  const auj=o.filter(i=>i.date===t).sort(ordre);
  const semaine=o.filter(i=>i.date && i.date>t && i.date<=fin).sort(ordre);
  const reste=o.filter(i=>!i.date || i.date>fin);
  const faitsAuj=actifs.filter(i=>i.fait && i.faitLe===t).filter(passe);
  const domOpt = S.filtre==="tout" ? {} : {dom:false};

  let h = bloc("En retard",[...rRetard.map(r=>ligneRoutine(r,domOpt)),...retard.map(i=>ligneItem(i,domOpt))],"late")
        + bloc("Aujourd'hui",[...rAuj.map(r=>ligneRoutine(r,domOpt)),...auj.map(i=>ligneItem(i,domOpt))])
        + bloc("Les 7 prochains jours",semaine.map(i=>ligneItem(i,domOpt)));
  const parDom = Object.keys(DOMAINES).map(k=>{
    const l=reste.filter(i=>domKey(i.domaine)===k).sort((a,b)=>(a.date?0:1)-(b.date?0:1)||ordre(a,b));
    return l.length ? `<div class="bloc dom d-${k}"><h3><span>${esc(DOMAINES[k].nom)}</span><span class="count">${l.length}</span></h3><ul class="list">${l.map(i=>ligneItem(i,{dom:false})).join("")}</ul></div>` : "";
  }).join("");
  if(parDom) h += `<div class="separe">Tout le reste à faire</div>` + parDom;
  h += bloc("Fait aujourd'hui",[...rFait.map(r=>ligneRoutine(r,domOpt)),...faitsAuj.map(i=>ligneItem(i,domOpt))]);
  if(!h) h = S.q||S.filtre!=="tout"
    ? `<div class="empty">Rien ne correspond. Change le filtre ou la recherche.</div>`
    : `<div class="empty">Ta liste est vide. Appuie sur le micro ou écris au-dessus pour ajouter quelque chose.</div>`;
  $("v-liste").innerHTML=h;

  // ----- Idées -----
  const iv=idees.filter(passe);
  const ideesHtml = Object.keys(DOMAINES).map(k=>{
    const l=iv.filter(i=>domKey(i.domaine)===k).sort((a,b)=>(b.cree||0)-(a.cree||0));
    return l.length ? `<div class="bloc dom d-${k}"><h3><span>${esc(DOMAINES[k].nom)}</span><span class="count">${l.length}</span></h3><ul class="list">${l.map(i=>ligneItem(i,{dom:false})).join("")}</ul></div>` : "";
  }).join("");
  $("v-idees").innerHTML = ideesHtml || `<div class="empty">${S.q||S.filtre!=="tout"?"Aucune idée ne correspond.":"Ta boîte à idées est vide. Dis « j'ai une idée… » et elle arrive ici."}</div>`;

  // ----- Routines & règles -----
  const domOpts = Object.entries(DOMAINES).map(([k,v])=>`<option value="${k}">${esc(v.nom)}</option>`).join("");
  const regles = S.regles.map(r=>`<li><div class="it"><div class="t">Quand ${esc(r.quand)}</div><div class="n">→ ${esc(r.alors)}${r.quandFaire?" · "+esc(r.quandFaire):""}</div></div><button class="icon" data-act="delRegle" data-id="${r.id}" aria-label="Supprimer la règle">${ICON_X}</button></li>`);
  const routs = S.routines.map(r=>`<li><div class="it"><div class="t">${esc(r.titre)}</div><div class="meta">${chip(r.domaine)}<span class="tag">${esc(rythme(r))}</span></div></div><button class="icon" data-act="delRoutine" data-id="${r.id}" aria-label="Supprimer la routine">${ICON_X}</button></li>`);
  $("v-routines").innerHTML = `
    <div class="bloc"><h3><span>Routines qui reviennent</span></h3>${routs.length?`<ul class="list">${routs.join("")}</ul>`:'<div class="empty">Aucune routine pour l\'instant.</div>'}</div>
    <form class="add" id="fRoutine">
      <span class="lbl">Ajouter une routine</span>
      <input id="rTitre" placeholder="Ex : Commander les légumes" required>
      <div class="row">
        <select id="rDom" aria-label="Domaine">${domOpts}</select>
        <select id="rMode" aria-label="Rythme"><option value="jour">Chaque semaine, le…</option><option value="tous">Tous les … jours</option></select>
        <select id="rJour" aria-label="Jour">${JOURS.map((j,i)=>`<option value="${i}">${j}</option>`).join("")}</select>
        <input id="rTous" class="n" type="number" min="1" value="7" aria-label="Nombre de jours" hidden>
      </div>
      <div><button class="btn">Ajouter la routine</button></div>
    </form>
    <div class="bloc"><h3><span>Suites automatiques</span></h3>${regles.length?`<ul class="list">${regles.join("")}</ul>`:'<div class="empty">Aucune règle pour l\'instant.</div>'}
      <p class="hint" style="margin:8px 2px 0">Quand tu dis quelque chose qui correspond, j'ajoute la suite toute seule.</p></div>
    <form class="add" id="fRegle">
      <span class="lbl">Ajouter une suite automatique</span>
      <input id="gQuand" placeholder="Quand… (ex : je passe une commande pour un client)" required>
      <input id="gAlors" placeholder="Alors… (ex : donner la facture à ce client)" required>
      <input id="gQuandFaire" placeholder="À quel moment ? (ex : le dimanche suivant)">
      <div><button class="btn">Ajouter la règle</button></div>
    </form>`;
}

/* ---------- Actions ---------- */
document.addEventListener("click", async e=>{
  const b=e.target.closest("[data-act],[data-filtre],nav.tabs button");
  if(!b) return;
  if(b.dataset.filtre){ S.filtre=b.dataset.filtre; render(); return; }
  if(b.closest("nav.tabs")){ montrerVue(b.dataset.v); return; }
  const id=b.dataset.id, act=b.dataset.act;
  try{
    if(act==="toggle"){ const it=S.items.find(i=>i.id===id); if(it) await maj("items",id,{fait:!it.fait, faitLe: !it.fait?today():null}); }
    if(act==="routine"){ const r=S.routines.find(x=>x.id===id); if(r){ const deja=r.dernier===today(); await maj("routines",id,{dernier: deja?(r.avant||null):today(), avant: deja?null:(r.dernier||null)}); } }
    if(act==="edit") ouvrirEdition(id);
    if(act==="delRegle") await suppr("regles",id);
    if(act==="delRoutine") await suppr("routines",id);
  }catch(err){ signaler(err); }
});
$("recherche").addEventListener("input",e=>{ S.q=e.target.value.trim(); render(); });
document.addEventListener("change", e=>{
  if(e.target.id==="rMode"){ const tous=e.target.value==="tous"; $("rJour").hidden=tous; $("rTous").hidden=!tous; }
});
document.addEventListener("submit", async e=>{
  if(e.target.id==="fRoutine"){
    e.preventDefault();
    const mode=$("rMode").value;
    const data={titre:$("rTitre").value.trim(), domaine:$("rDom").value, mode, depuis:today(), dernier:null};
    if(mode==="tous") data.tous=Math.max(1,Number($("rTous").value)||7); else data.jour=Number($("rJour").value);
    if(data.titre) try{ await ajouter("routines",data); }catch(err){ signaler(err); }
  }
  if(e.target.id==="fRegle"){
    e.preventDefault();
    const data={quand:$("gQuand").value.trim(), alors:$("gAlors").value.trim(), quandFaire:$("gQuandFaire").value.trim()};
    if(data.quand && data.alors) try{ await ajouter("regles",data); }catch(err){ signaler(err); }
  }
});
function montrerVue(v){
  S.vue=v;
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.v===v)));
  ["liste","idees","routines"].forEach(x=>$("v-"+x).hidden = x!==v);
  render();
  try{ localStorage.setItem("vt-vue",v); }catch{}
}
function signaler(err){
  const code=err&&err.code;
  $("etatDonnees").hidden=false;
  $("etatDonnees").textContent = code==="quota_exceeded" ? "La liste est pleine : supprime quelques anciens éléments faits." : "Je n'ai pas pu enregistrer ce changement. Réessaie dans un instant.";
}

/* ---------- Édition ---------- */
let enEdition=null;
$("eDom").innerHTML = Object.entries(DOMAINES).map(([k,v])=>`<option value="${k}">${esc(v.nom)}</option>`).join("");
function ouvrirEdition(id){
  const it=S.items.find(i=>i.id===id); if(!it) return;
  enEdition=id;
  $("eTitre").value=it.titre||""; $("eNote").value=it.note||""; $("eType").value=it.type||"tache"; $("eDom").value=domKey(it.domaine);
  $("eDate").value=it.date||""; $("eHeure").value=it.heure||"";
  $("sheet").hidden=false; $("eTitre").focus();
}
const fermer = ()=>{ $("sheet").hidden=true; enEdition=null; };
$("eAnnuler").onclick=fermer;
$("sheet").addEventListener("click",e=>{ if(e.target.id==="sheet") fermer(); });
$("editForm").addEventListener("submit",async e=>{
  e.preventDefault(); if(!enEdition) return;
  const patch={titre:$("eTitre").value.trim(), note:$("eNote").value.trim()||null, type:$("eType").value, domaine:$("eDom").value, date:$("eDate").value||null, heure:$("eHeure").value||null};
  const id=enEdition; fermer();
  try{ await maj("items",id,patch); }catch(err){ signaler(err); }
});
$("eSuppr").onclick=async ()=>{ const id=enEdition; fermer(); try{ await suppr("items",id); }catch(err){ signaler(err); } };

/* ---------- L'agent : comprendre et ranger ---------- */
let sample=null, tts=null, dict=null, voixOK=true;
function calendrier(){
  const t=today(), out=[];
  for(let i=0;i<15;i++){ const s=addDays(t,i); out.push(JOURS[parseIso(s).getDay()]+" "+s); }
  return out.join(", ");
}
function consigne(texte){
  const regles = S.regles.length ? S.regles.map(r=>`- Quand ${r.quand} → ${r.alors}${r.quandFaire?" ("+r.quandFaire+")":""}`).join("\n") : "- (aucune)";
  const doms = Object.entries(DOMAINES).map(([k,v])=>`${k} : ${v.desc}`).join("\n");
  return `Tu es l'assistant d'organisation de Shlomo, un entrepreneur qui gère plusieurs activités à la fois. Il vient de te dire ceci (dictée orale, il peut y avoir des hésitations, du français et de l'hébreu mélangés) :
"""${texte}"""

Aujourd'hui : ${JOURS[new Date().getDay()]} ${today()}, heure locale ${new Date().toTimeString().slice(0,5)}.
Calendrier des 15 prochains jours : ${calendrier()}.

Domaines (utilise la clé) :
${doms}

Ses suites automatiques :
${regles}

Ta mission : découpe ce qu'il dit en éléments à ranger.
- "tache" : une chose à faire. Titre court à l'infinitif (ex : "Charger les batteries").
- "rdv" : un événement à un moment précis (séance photo, rendez-vous, livraison).
- "idee" : une idée à garder sans action précise pour l'instant.
Mets une date (AAAA-MM-JJ) seulement s'il en donne une ou si elle se déduit clairement ("demain", "dimanche", "la semaine prochaine" = le lundi suivant). Sinon date null.
Si une de ses suites automatiques s'applique, ajoute aussi la tâche de suite avec "auto": true et la bonne date.
Si tu connais la raison ou le contexte de la tâche grâce à ce qu'il dit, mets-le dans "note" (une phrase courte), sinon null.
Ne crée pas d'élément pour une chose déjà faite, sauf sa suite automatique.
Titres en français, sans prénoms inventés.

Réponds uniquement avec ce JSON :
{"items":[{"type":"tache","titre":"...","note":null,"domaine":"resto","date":"2026-11-22","heure":null,"auto":false}],"reponse":"une phrase courte et naturelle, en le tutoyant, qui dit ce que tu as rangé"}
Si rien n'est à ranger, "items" est vide et "reponse" le dit gentiment.`;
}

let dernierAjout=[];
async function traiter(texte){
  texte=texte.trim(); if(!texte) return;
  const recu=$("recu"); recu.hidden=false;
  recu.innerHTML=`<div class="thinking">Je range ça…</div>`;
  $("envoyer").disabled=true;
  let items=[], reponse="";
  try{
    if(!sample) throw {code:"no_sample"};
    const res = await sample.json(consigne(texte), {modelTier:"quick", cache:false});
    items = Array.isArray(res&&res.items) ? res.items : [];
    reponse = String(res&&res.reponse||"");
  }catch(e){
    if(e && e.code==="not_granted") sample=null;
    items=[{type:"tache", titre:texte.slice(0,160), domaine:"perso", date:null, heure:null}];
    reponse = (e && (e.code==="no_sample" || e.code==="not_granted"))
      ? "Je l'ai noté tel quel dans Perso / admin. Tu peux le déplacer en le modifiant."
      : "Je n'ai pas réussi à trier, alors je l'ai noté tel quel dans Perso / admin.";
  }
  const propres = items.filter(i=>i && i.titre).map(i=>({
    type:["tache","rdv","idee"].includes(i.type)?i.type:"tache",
    titre:String(i.titre).slice(0,200),
    note:i.note?String(i.note).slice(0,400):null,
    domaine:DOMAINES[i.domaine]?i.domaine:"perso",
    date:/^\d{4}-\d{2}-\d{2}$/.test(i.date||"")?i.date:null,
    heure:/^\d{2}:\d{2}$/.test(i.heure||"")?i.heure:null,
    auto:!!i.auto, fait:false, cree:Date.now(), source:texte.slice(0,500)
  }));
  dernierAjout=[];
  try{ for(const it of propres){ const id=await ajouter("items",it); dernierAjout.push({id,...it}); } }
  catch(err){ signaler(err); }
  $("saisie").value=""; brouillon("");
  $("envoyer").disabled=false;
  recu.innerHTML = `<div class="msg">${esc(reponse||"C'est rangé.")}</div>
    ${dernierAjout.length?`<ul>${dernierAjout.map(i=>`<li>${chip(i.domaine)}<span>${esc(i.titre)}</span>${i.date?`<span class="tag">${esc(joliDate(i.date))}${i.heure?" · "+esc(i.heure):""}</span>`:""}${i.type==="idee"?'<span class="tag">idée</span>':""}${i.auto?'<span class="tag auto">suite auto</span>':""}</li>`).join("")}</ul>
    <div><button class="ghost" id="annulerAjout">Annuler l'ajout</button></div>`:""}`;
  const a=$("annulerAjout");
  if(a) a.onclick=async ()=>{ for(const i of dernierAjout){ try{ await suppr("items",i.id); }catch{} } dernierAjout=[]; recu.innerHTML='<div class="msg">Ajout annulé.</div>'; };
  parler(reponse);
}
$("envoyer").onclick=()=>traiter($("saisie").value);
$("saisie").addEventListener("keydown",e=>{ if(e.key==="Enter" && (e.metaKey||e.ctrlKey)) traiter($("saisie").value); });
$("saisie").addEventListener("input",e=>brouillon(e.target.value));
function brouillon(v){ try{ localStorage.setItem("vt-brouillon",v); }catch{} }
try{ const b=localStorage.getItem("vt-brouillon"); if(b) $("saisie").value=b; }catch{}

function parler(txt){
  if(!tts||!voixOK||!txt) return;
  tts.speak(txt.slice(0,1900),{language:"fr"}).catch(e=>{ if(e&&e.code==="not_granted"){ tts=null; $("ecouter").hidden=true; } });
}
function resumeDuJour(){
  const t=today();
  const ouverts=S.items.filter(i=>i.type!=="idee"&&!i.fait);
  const auj=ouverts.filter(i=>i.date===t).sort(ordre), retard=ouverts.filter(i=>i.date&&i.date<t);
  const routs=S.routines.filter(r=>["due","retard"].includes(etatRoutine(r)));
  const total=auj.length+retard.length+routs.length;
  if(!total) return "Rien d'urgent aujourd'hui. Dis-moi dès que tu as une idée.";
  let s=`Aujourd'hui, tu as ${total} chose${total>1?"s":""} à faire. `;
  for(const k of Object.keys(DOMAINES)){
    const l=[...routs.filter(r=>r.domaine===k).map(r=>r.titre), ...auj.filter(i=>i.domaine===k).map(i=>(i.heure?"à "+i.heure.replace(":"," heures ")+", ":"")+i.titre)];
    if(l.length) s+=`${DOMAINES[k].nom} : ${l.join(", ")}. `;
  }
  if(retard.length) s+=`Et ${retard.length} en retard : ${retard.slice(0,4).map(i=>i.titre).join(", ")}.`;
  return s;
}
$("ecouter").onclick=()=>{ if(tts){ voixOK=true; tts.speak(resumeDuJour(),{language:"fr"}).catch(()=>{}); } };

/* ---------- Dictée ---------- */
function setupDictee(){
  const mic=$("mic");
  mic.hidden=false; $("hint").textContent="Appuie sur le micro, parle, puis appuie à nouveau pour ranger.";
  dict.onPartial(({text})=>{ const p=$("partial"); p.hidden=!text; p.textContent=text; });
  dict.onFinal(({text})=>{ const s=$("saisie"); s.value = (s.value ? s.value+text : text.replace(/^\s+/,"")); });
  dict.onState(({state,reason})=>{
    const on = state!=="idle";
    mic.classList.toggle("on",on);
    mic.setAttribute("aria-label",on?"Arrêter et ranger":"Parler");
    $("capTitre").textContent = on ? "Je t'écoute…" : "Qu'est-ce qui te passe par la tête ?";
    if(state==="idle"){
      $("partial").hidden=true;
      if((reason==="stopped"||reason==="viewer_stopped") && $("saisie").value.trim()) traiter($("saisie").value);
      if(reason==="not_granted"||reason==="unavailable"){ mic.hidden=true; $("hint").textContent="Le micro n'est pas disponible ici : écris, ou utilise la dictée du clavier."; }
    }
  });
  mic.onclick=()=>{
    if(dict.active()){ dict.stop().catch(()=>{}); return; }
    voixOK=true;
    dict.start().catch(e=>{
      if(e&&e.code==="not_granted"){ mic.hidden=true; $("hint").textContent="Micro refusé : tu peux écrire ou utiliser la dictée du clavier."; }
      else if(e&&e.code==="rate_limited") $("hint").textContent="Le micro est occupé, réessaie dans un instant.";
    });
  };
}

/* ---------- Démarrage ---------- */
$("dateDuJour").textContent = (()=>{ const d=new Date(); const j=JOURS[d.getDay()]; return j[0].toUpperCase()+j.slice(1)+" "+d.getDate()+" "+MOIS[d.getMonth()]; })();
try{ const v=localStorage.getItem("vt-vue"); if(v && $("v-"+v)) montrerVue(v); else render(); }catch{ render(); }

(async ()=>{
  if(!window.claude){ $("etatDonnees").textContent="Ouvre cette page dans Claude pour retrouver tes listes."; return; }
  const [d, s, t, dc] = await Promise.all(["db","sample","tts","dictation"].map(n=>window.claude.use(n).catch(()=>null)));
  sample=s; tts=t; dict=dc;
  if(tts) $("ecouter").hidden=false;
  if(dict) setupDictee();
  if(!d){ $("etatDonnees").textContent="Tes listes ne peuvent pas être enregistrées ici : ce que tu ajoutes disparaîtra en fermant la page."; return; }
  db=d;
  const recus=new Set(); let confirme=false;
  const timer=setTimeout(()=>{ if(!confirme){ $("etatDonnees").hidden=false; $("etatDonnees").textContent="Tes listes mettent du temps à arriver… vérifie ta connexion."; } },10000);
  for(const col of ["items","routines","regles"]){
    db.collection(col).onSnapshot(snap=>{
      S[col]=snap.docs.map(x=>({id:x.id,...x.data()}));
      recus.add(col);
      if(recus.size===3){ $("etatDonnees").hidden=true; if(!snap.metadata.fromCache){ confirme=true; clearTimeout(timer); } }
      render();
    }, ()=>{ clearTimeout(timer); $("etatDonnees").hidden=false; $("etatDonnees").textContent="Tes listes ne sont pas accessibles pour le moment."; });
  }
})();

let jourAffiche=today();
setInterval(()=>{ if(today()!==jourAffiche){ jourAffiche=today(); render(); } },60000);
</script>
